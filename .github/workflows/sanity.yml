name: bridge-release-gates

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/openclaw-bridge/openclaw-extension/package-lock.json
      - run: npm ci
        working-directory: plugins/openclaw-bridge/openclaw-extension
      - run: npm test
        working-directory: plugins/openclaw-bridge/openclaw-extension
      - run: node --test scripts/bridge-acceptance-gate.test.mjs
      - run: scripts/bridge-acceptance-gate.mjs
      - run: node --test scripts/bridge-release-gate.test.mjs
      - run: scripts/bridge-release-gate.mjs
      - run: scripts/test-bridge-lifecycle.sh
      - run: scripts/verify-sanitized.sh
      - run: bash -n scripts/*.sh

  pinned-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read pinned Hermes revision
        id: hermes
        run: |
          echo "commit=$(node -e 'const m=require("./compatibility-manifest.json"); console.log(m.plugins.find((p)=>p.id==="hermes-agent-bridge").supportedHarness.commit)')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes.outputs.commit }}
          persist-credentials: false
          path: pinned-hermes
      - run: python -m pip install --disable-pip-version-check -e './pinned-hermes[dev]' 'aiohttp==3.14.1'
      - run: HERMES_PYTHON="$(command -v python)" scripts/test-hermes-bridge-against-checkout.sh pinned-hermes

  pinned-openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Read pinned OpenClaw revision
        id: openclaw
        run: |
          echo "commit=$(node -e 'const m=require("./compatibility-manifest.json"); console.log(m.plugins.find((p)=>p.id==="openclaw-bridge").supportedHarness.commit)')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw.outputs.commit }}
          persist-credentials: false
          path: pinned-openclaw
      - run: scripts/test-openclaw-bridge-against-checkout.sh pinned-openclaw
